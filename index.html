<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Game</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <div id="game">
        <div id="road">
            <img id="imgback" src="./car/mainpicture.png" alt="">

            <div id="player-car">
                <img src="./car/maincar.png" alt="">
            </div>

            <div class="enemy-car">
                <img src="./car/moror.png" alt="">
            </div>

            <div class="enemy-car">
                <img src="./car/truck.png">
            </div>

            <div class="enemy-car">
                <!-- <img src="./car/labo.png" alt=""> -->
            </div>

            <div class="enemy-car">
                <img src="./car/ChatGPT Image Aug 16, 2026, 10_04_01 AM.png" alt="">
            </div>

            <div class="enemy-car">
                <img id="fast" src="./car/red.png" alt="">
            </div>

        </div>

        <div id="score">Score : 0</div>
        <div id="level">Level : 1</div>
        <div id="speed">Speed : 3</div>

        <div id="game-over">
            GAME OVER
        </div>

        <button id="start-btn">
            Start Game
        </button>

    </div>

    <script src="game.js"></script>
</body>
</html>
